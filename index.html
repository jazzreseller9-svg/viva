<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk My Kesayangann ❤️ — Minta Maaf</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            min-height:100vh;
            background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);
            font-family:Arial,sans-serif;
            text-align:center;
            padding:30px 20px;
        }
        /* Butang Muzik */
        .butang-muzik{
            position:fixed;top:15px;right:15px;z-index:10;
            padding:10px 18px;border-radius:50px;border:none;
            background:white;box-shadow:0 3px 10px rgba(0,0,0,0.1);
            cursor:pointer;font-size:15px;font-weight:bold;
            transition:all 0.3s ease;
        }
        .butang-muzik.aktif{background:#e74c3c;color:white}

        .kotak{
            background:white;
            border-radius:25px;
            padding:40px 25px;
            max-width:400px;
            margin:0 auto;
            box-shadow:0 10px 30px rgba(0,0,0,0.15);
        }
        .emoji{font-size:50px;margin-bottom:20px}
        h1{font-size:22px;color:#b03a2e;margin-bottom:15px}
        h2{font-size:20px;color:#6c3483;margin-bottom:15px}
        p{font-size:16px;color:#444;line-height:1.8;margin-bottom:10px}
        .hati{font-size:30px;margin:15px 0;color:red}
        .butang{
            padding:12px 25px;
            border-radius:50px;
            border:none;
            background:#e74c3c;
            color:white;
            font-size:16px;
            margin-top:20px;
            cursor:pointer;
            transition:transform 0.2s ease;
        }
        .butang:active{transform:scale(0.95)}
        .halaman{display:none}
        .halaman.aktif{display:block}
    </style>
</head>
<body>

    <!-- BUTANG & LAGU -->
    <button class="butang-muzik" id="muzikBtn" onclick="mainHentiMuzik()">🎵 Main Lagu</button>
    <audio id="lagu" loop preload="auto">
        <source src="kota-ini-tak-sama-tanpamu.mp3" type="audio/mpeg">
        
    

    <div class="kotak">
        <!-- HALAMAN 1 -->
        <div class="halaman aktif" id="h1">
            <div class="emoji">🙏</div>
            <h1>Hai Via... ❤️</h1>
            <p>Saya ingin berkata kata HAHAHA.</p>
            <p>OKEY MULA</p>...</p>
            <div class="hati">❤️</div>
        </div>

        <!-- HALAMAN 2 -->
        <div class="halaman" id="h2">
            <div class="emoji">💔</div>
            <h2>Saya Minta Maaf 🙏</h2>
            <p>Sorry yaa via sebab buat dia marah — sama ada sengaja atau tidak sengaja.</p>
            <p>sedar juga sebab banyak mesej nya dia padam.</p>
            <div class="hati">🥺❤️</div>
        </div>

        <!-- HALAMAN 3 -->
        <div class="halaman" id="h3">
            <div class="emoji">🤞</div>
            <h2>Sorry  ❤️</h2>
            <p>Saya janji akan berusaha menjadi lebih baik for you.</p>
            <p>Jan marah ii yaaa.</p>
            <p>Semoga diaa nda marahh ii sudaa.</p>
            <div class="hati">💕</div>
        </div>

        <!-- HALAMAN 4 -->
        <div class="halaman" id="h4">
            <div class="emoji">🥰</div>
            <h2>Terima Kasih ❤️</h2>
            <p>TQ sebab baca viaa.</p>
            <p>Sayanggg diaaa. Okeyy tedaa marahh ii sudaa yaa loveeuuu viaa.</p>
            <div class="hati">❤️❤️❤️</div>
            <p style="font-style:italic;color:#777;margin-top:20px;">— Yang ikhlas, dari hati saya untuk Via ❤️<br><small>"Kota ini tak sama tanpamu" 🎶</small></p>
        </div>

        <!-- BUTANG NAVIGASI -->
        <div style="margin-top:25px;">
            <button class="butang" onclick="tukar(-1)">← Sebelum</button>
            <button class="butang" onclick="tukar(1)">Seterusnya →</button>
        </div>
    </div>

<script>
    let sekarang = 1;
    const jumlah = 4;
    const lagu = document.getElementById('lagu');
    const muzikBtn = document.getElementById('muzikBtn');
    let sedangMain = false;

    function kemasKini(){
        for(let i=1;i<=jumlah;i++){
            document.getElementById('h'+i).classList.remove('aktif');
        }
        document.getElementById('h'+sekarang).classList.add('aktif');
    }

    function tukar(arah){
        sekarang = sekarang + arah;
        if(sekarang < 1) sekarang = jumlah;
        if(sekarang > jumlah) sekarang = 1;
        kemasKini();
    }

    // FUNGSI MAIN/HENTI LAGU
    function mainHentiMuzik(){
        if(sedangMain){
            lagu.pause();
            muzikBtn.innerText = '🎵 Main Lagu';
            muzikBtn.classList.remove('aktif');
        } else {
            lagu.play().catch(()=>{
                alert('Sila tekan sekali lagi untuk main lagu 🎶');
            });
            muzikBtn.innerText = '⏸ Henti';
            muzikBtn.classList.add('aktif');
        }
        sedangMain = !sedangMain;
    }
</script>
</body>
</html>
