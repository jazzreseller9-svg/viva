<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Via ❤️ — Saya Minta Maaf</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            min-height:100vh;
            display:flex;justify-content:center;align-items:center;
            background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);
            font-family:'Segoe UI',sans-serif;
            text-align:center;
            padding:30px 20px;
            transition:all 0.8s ease;
        }
        .page1{background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%)}
        .page2{background:linear-gradient(135deg,#e0c3fc 0%,#8ec5fc 100%)}
        .page3{background:linear-gradient(135deg,#d4fc79 0%,#96e6a1 100%)}
        .page4{background:linear-gradient(135deg,#fa709a 0%,#fee140 100%)}

        .container{
            background:rgba(255,255,255,0.9);
            border-radius:28px;
            padding:40px 25px;
            max-width:420px;
            box-shadow:0 15px 50px rgba(0,0,0,0.15);
            width:100%;
        }

        .emoji{font-size:60px;margin-bottom:20px}
        h1{font-size:1.8em;color:#b03a2e;margin-bottom:15px}
        h2{font-size:1.5em;color:#6c3483;margin-bottom:15px}
        p{font-size:1.1em;color:#444;line-height:1.8;margin-bottom:12px}
        .hati{font-size:2em;margin:15px 0;color:#e74c3c}
        .tanda{margin-top:20px;font-style:italic;color:#777}

        .navigasi{margin-top:25px;display:flex;gap:12px;justify-content:center}
        .btn{
            padding:12px 22px;border-radius:50px;border:none;
            background:linear-gradient(135deg,#f1948a,#e74c3c);
            color:white;font-size:1em;font-weight:600;cursor:pointer;
        }
        .btn-sec{background:linear-gradient(135deg,#aed6f1,#5dade2)}

        .musik{
            position:fixed;top:15px;right:15px;z-index:10;
            padding:10px 15px;border-radius:50px;border:none;
            background:white;box-shadow:0 3px 10px rgba(0,0,0,0.1);
            cursor:pointer;font-size:0.9em
        }

        .halaman{display:none}
        .halaman.aktif{display:block}

        .titik{display:flex;justify-content:center;gap:10px;margin-top:20px}
        .dot{width:12px;height:12px;border-radius:50%;background:#ddd}
        .dot.aktif{background:#e74c3c}
    </style>
</head>
<body class="page1">

    <button class="musik" id="butangMuzik" onclick="mainHentiMuzik()">🎵 Main</button>
    <audio id="lagu" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    

    <div class="container">

        <div class="halaman aktif" id="h1">
            <div class="emoji">🙏</div>
            <h1>Hai Via... ❤️</h1>
            <p>Saya ada sesuatu yang sangat penting untuk saya katakan kepada awak.</p>
            <p>Izinkan saya luahkan dari hati saya...</p>
            <div class="hati">❤️</div>
        </div>

        <div class="halaman" id="h2">
            <div class="emoji">💔</div>
            <h2>Saya Minta Maaf 🙏</h2>
            <p>Dari lubuk hati yang paling dalam,<br>saya memohon maaf atas segala kesalahan —<br>sama ada sengaja atau tidak sengaja.</p>
            <p>Saya sedar saya telah lukakan hati awak,<br>dan saya benar-benar menyesal.</p>
            <div class="hati">🥺❤️</div>
        </div>

        <div class="halaman" id="h3">
            <div class="emoji">🤞</div>
            <h2>Saya Janji ❤️</h2>
            <p>Saya janji akan berusaha menjadi lebih baik untuk awak.</p>
            <p>Awak sangat berharga bagi saya,<br>dan saya tak mahu kehilangan awak.</p>
            <p>Semoga awak sudi memberi saya peluang.</p>
            <div class="hati">💕</div>
        </div>

        <div class="halaman" id="h4">
            <div class="emoji">🥰</div>
            <h2>Terima Kasih ❤️</h2>
            <p>Terima kasih kerana sudi membaca ini sehingga habis.</p>
            <p>Saya sayang awak, Via.<br>Semoga kita baik semula.</p>
            <div class="hati">❤️❤️❤️</div>
            <p class="tanda">— Yang ikhlas, dari hati saya untuk Via ❤️</p>
        </div>

        <div class="titik">
            <span class="dot aktif" onclick="keHalaman(1)"></span>
            <span class="dot" onclick="keHalaman(2)"></span>
            <span class="dot" onclick="keHalaman(3)"></span>
            <span class="dot" onclick="keHalaman(4)"></span>
        </div>

        <div class="navigasi">
            <button class="btn btn-sec" onclick="tukarHalaman(-1)">← Sebelum</button>
            <button class="btn" onclick="tukarHalaman(1)">Seterusnya →</button>
        </div>
    </div>

<script>
    let halamanSemasa = 1;
    const jumlahHalaman = 4;
    const lagu = document.getElementById('lagu');
    let sedangMain = false;

    function kemasKiniHalaman(){
        for(let i=1;i<=jumlahHalaman;i++){
            document.getElementById(`h${i}`).classList.remove('aktif');
            document.querySelectorAll('.dot')[i-1].classList.remove('aktif');
        }
        document.getElementById(`h${halamanSemasa}`).classList.add('aktif');
        document.querySelectorAll('.dot')[halamanSemasa-1].classList.add('aktif');
        document.body.className = `page${halamanSemasa}`;
    }

    function tukarHalaman(arah){
        halamanSemasa += arah;
        if(halamanSemasa < 1) halamanSemasa = jumlahHalaman;
        if(halamanSemasa > jumlahHalaman) halamanSemasa = 1;
        kemasKiniHalaman();
    }

    function keHalaman(nombor){
        halamanSemasa = nombor;
        kemasKiniHalaman();
    }

    function mainHentiMuzik(){
        if(sedangMain){
            lagu.pause();
            document.getElementById('butangMuzik').innerText = '🎵 Main';
        } else {
            lagu.play().catch(err=>alert('Tekan sekali lagi untuk main lagu'));
            document.getElementById('butangMuzik').innerText = '⏸ Henti';
        }
        sedangMain = !sedangMain;
    }

    setInterval(()=>{
        halamanSemasa++;
        if(halamanSemasa > jumlahHalaman) halamanSemasa = 1;
        kemasKiniHalaman();
    }, 10000);
</script>

</body>
</html>
